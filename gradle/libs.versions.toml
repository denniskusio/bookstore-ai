# Single source of truth for versions that this repository pins itself.
#
# Everything Spring Boot manages (Hibernate, Flyway, Testcontainers, Kafka client, ...)
# is deliberately NOT listed here: its version comes from the Spring Boot BOM, which the
# convention plugins import via SpringBootPlugin.BOM_COORDINATES. That keeps one knob
# (`spring-boot`) instead of dozens that can drift apart.

[versions]
java = "25"                  # current LTS; Spring Boot 4.1 supports 17 - 26
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"    # "Oakwood" train, compatible with Boot 4.0.x and 4.1.x
spring-ai = "2.0.1"          # GA for Boot 4.0 / 4.1

[libraries]
# BOMs that Spring Boot does not manage; imported per service via platform(...)
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

# Only used on the classpath of build-logic (convention plugins)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
