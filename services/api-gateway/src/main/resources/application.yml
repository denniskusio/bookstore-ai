spring:
  application:
    name: api-gateway
  profiles:
    # Default when nothing else is set. SPRING_PROFILES_ACTIVE (docker, k8s) overrides it.
    active: local
  cloud:
    gateway:
      server:
        webflux:
          # Routes are identical in every environment; only the upstream base URLs differ,
          # and those come from the profile-specific blocks below (bookstore.upstream.*).
          routes:
            - id: user-service
              uri: ${bookstore.upstream.user}
              predicates:
                - Path=/users/**
            - id: book-service
              uri: ${bookstore.upstream.book}
              predicates:
                - Path=/books/**
            - id: order-service
              uri: ${bookstore.upstream.order}
              predicates:
                - Path=/orders/**
            - id: assistant-service
              uri: ${bookstore.upstream.assistant}
              predicates:
                - Path=/assistant/**

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
# Services run on the host (./gradlew bootRun), infrastructure in Docker Compose.
spring:
  config:
    activate:
      on-profile: local

bookstore:
  upstream:
    user: http://localhost:8081
    book: http://localhost:8082
    order: http://localhost:8083
    assistant: http://localhost:8084

---
# Everything runs in Docker Compose; service discovery is Compose's built-in DNS.
spring:
  config:
    activate:
      on-profile: docker

bookstore:
  upstream:
    user: http://user-service:8081
    book: http://book-service:8082
    order: http://order-service:8083
    assistant: http://assistant-service:8084

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: docker

---
# Everything runs in Kubernetes; service discovery is Service DNS (<service>.<namespace>.svc.cluster.local).
spring:
  config:
    activate:
      on-profile: k8s

bookstore:
  upstream:
    user: http://user-service.bookstore.svc.cluster.local:8081
    book: http://book-service.bookstore.svc.cluster.local:8082
    order: http://order-service.bookstore.svc.cluster.local:8083
    assistant: http://assistant-service.bookstore.svc.cluster.local:8084

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: k8s
